name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare files
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp adhan.wav resources/adhan.wav
      - run: npm install
      - run: npx cap add android
      - name: Configure Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp resources/adhan.wav android/app/src/main/res/raw/adhan.wav
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/><application#' $M
          npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-times-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
